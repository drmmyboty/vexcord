name: Build Vexcord Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vexcord repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Get Revenge Manager source
        run: git clone --depth 1 https://github.com/revenge-mod/revenge-manager.git manager

      - name: Apply Vexcord branding
        working-directory: manager
        run: |
          python3 - <<'PY'
          from pathlib import Path

          strings = Path("app/src/main/res/values/strings.xml")
          content = strings.read_text()
          old = '<string name="app_name" translatable="false">Revenge Manager</string>'
          new = '<string name="app_name" translatable="false">Vexcord Installer</string>'
          if old not in content:
              raise SystemExit("Could not find upstream manager app_name string; stopping rather than making an unbranded APK.")
          strings.write_text(content.replace(old, new, 1))

          gradle = Path("app/build.gradle.kts")
          content = gradle.read_text()
          replacements = {
              'buildConfigField("String", "MOD_NAME", "\\"Revenge\\"")':
                  'buildConfigField("String", "MOD_NAME", "\\"Vexcord\\"")',
              'buildConfigField("String", "MANAGER_NAME", "\\"RevengeManager\\"")':
                  'buildConfigField("String", "MANAGER_NAME", "\\"VexcordInstaller\\"")',
              'buildConfigField("String", "REPO", "\\"revenge-mod/bundle\\"")':
                  'buildConfigField("String", "REPO", "\\"revenge-mod/revenge-bundle\\"")',
              'buildConfigField("int", "MODDED_APP_ICON", "0xFEB23A42")':
                  'buildConfigField("int", "MODDED_APP_ICON", "0xFF0072CB")',
              'buildConfigField("int", "MODDED_APP_ICON_ALPHA", "0xFFFBB33C")':
                  'buildConfigField("int", "MODDED_APP_ICON_ALPHA", "0xFF9CCBFF")',
              'buildConfigField("int", "MODDED_APP_ICON_OTHER", "0xFFD3575E")':
                  'buildConfigField("int", "MODDED_APP_ICON_OTHER", "0xFF164E87")',
          }
          for before, after in replacements.items():
              if before not in content:
                  raise SystemExit("Expected upstream branding setting was not found: " + before)
              content = content.replace(before, after, 1)
          gradle.write_text(content)
          PY

      - name: Build release APK
        working-directory: manager
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Vexcord installer APK
        uses: actions/upload-artifact@v4
        with:
          name: vexcord-installer-apk
          path: manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
