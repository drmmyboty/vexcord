name: Build Vexcord Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build original Vexcord Manager
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vexcord source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Package plugin catalog into app
        run: |
          mkdir -p app/src/main/assets
          cp patch-engine/catalog.json app/src/main/assets/plugin-catalog.json

      - name: Build standalone Vexcord Manager APK
        run: gradle --no-daemon assembleDebug

      - name: Upload Vexcord Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Vexcord-Manager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
