name: Build Vexcord APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Vexcord standalone APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vexcord
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Vexcord APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Vexcord.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vexcord-APK
          path: Vexcord.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Vexcord Latest
          make_latest: true
          files: Vexcord.apk
          fail_on_unmatched_files: true
